name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src scripts tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-serve.txt -r requirements-dev.txt
      - run: pytest -v

  quality-gate:
  runs-on: ubuntu-latest
  needs: test
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - run: pip install pyyaml
    - run: python scripts/check_model_gate.py

  build-push:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push and update manifest
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/jailbreak-api
          TAG=sha-${GITHUB_SHA::8}
          docker build -f docker/Dockerfile.serve -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

          sed -i "s|image: .*jailbreak-api:.*|image: $IMAGE:$TAG|" k8s/api.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add k8s/api.yaml
          git commit -m "ci: deploy $IMAGE:$TAG [skip ci]"
          git push