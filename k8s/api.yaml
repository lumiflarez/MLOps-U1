apiVersion: apps/v1
kind: Deployment
metadata:
  name: jailbreak-api
  namespace: mlops
  labels:
    app: jailbreak-api
spec:
  replicas: 2                        
  selector:
    matchLabels:
      app: jailbreak-api             
  template:
    metadata:
      labels:
        app: jailbreak-api           
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/lumiflarez/jailbreak-api:sha-a5764d5b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MLFLOW_TRACKING_URI          
              valueFrom:
                configMapKeyRef:
                  name: train-config
                  key: MLFLOW_TRACKING_URI
          envFrom:
            - secretRef:
                name: mlflow-credentials
          readinessProbe:                       
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:                         
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: jailbreak-api
  namespace: mlops
  labels:
    app: jailbreak-api
spec:
  selector:
    app: jailbreak-api
  ports:
    - port: 80
      targetPort: 8080